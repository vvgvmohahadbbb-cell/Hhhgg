name: Auto build Shadow Strike
on:
  push:
    paths: ['games/shadowstrike/**']
  workflow_dispatch:
permissions:
  actions: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Start Godot APK build
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/godot-apk.yml/dispatches \
            -d '{"ref":"main","inputs":{"slug":"shadowstrike","name":"Shadow Strike"}}'
