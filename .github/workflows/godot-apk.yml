name: Godot APK
on:
  workflow_dispatch:
    inputs:
      slug: {required: true}
      name: {required: true}
      godot: {required: false, default: '4.3.0'}
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SLUG: ${{ inputs.slug }}
      APPNAME: ${{ inputs.name }}
      PROJ: games/${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: حزم أندرويد
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ inputs.godot }}
          use-dotnet: false
          include-templates: true
      - name: مفتاح التوقيع
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: إعدادات Godot للتصدير
        run: |
          VER=$(godot --version | grep -oE '^[0-9]+\.[0-9]+' | head -1)
          mkdir -p ~/.config/godot
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' > ~/.config/godot/editor_settings-$VER.tres
          cat ~/.config/godot/editor_settings-$VER.tres
      - name: تجهيز المشروع
        working-directory: ${{ env.PROJ }}
        run: |
          test -f project.godot
          python3 - <<'PY'
          import re
          p = 'project.godot'
          s = open(p, encoding='utf-8').read()
          if 'import_etc2_astc' not in s:
              line = 'textures/vram_compression/import_etc2_astc=true'
              if re.search(r'^\[rendering\]\s*$', s, re.M):
                  s = re.sub(r'^\[rendering\]\s*$', '[rendering]\n\n' + line, s, count=1, flags=re.M)
              else:
                  s = s.rstrip('\n') + '\n\n[rendering]\n\n' + line + '\n'
              open(p, 'w', encoding='utf-8').write(s)
          PY
          if [ ! -f export_presets.cfg ]; then
            cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.qasim.$SLUG"
          package/name="$APPNAME"
          package/signed=true
          EOF
          fi
      - name: استيراد وتصدير
        working-directory: ${{ env.PROJ }}
        run: |
          godot --headless --path . --import || true
          mkdir -p build
          godot --headless --path . --export-debug Android build/game.apk
          test -f build/game.apk
          ls -la build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.slug }}
          files: ${{ env.PROJ }}/build/game.apk
